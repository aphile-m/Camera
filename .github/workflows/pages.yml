# Publish Stops to GitHub Pages.
# The app is static — no build step — so this uploads the repository as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/photography-app-redesign-sjyek1, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # NOTE: Pages must be switched on once, by hand, before this can run:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The `enablement: true` option exists but cannot work here — creating a
      # Pages site needs repository-admin rights, and the automatic
      # GITHUB_TOKEN never has them ("Resource not accessible by integration").
      # Once the switch is on, every push deploys with no further setup.
      - uses: actions/configure-pages@v5

      - name: Strip files that do not belong on the site
        # The Android shell, its icon overlay, the signing keystore and the
        # Capacitor placeholder are build inputs, not part of the web app.
        run: |
          rm -rf .github .git android android-res android-assets android-signing www node_modules
          rm -f package.json package-lock.json capacitor.config.json
          ls -A

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
